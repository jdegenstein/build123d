name: benchmarks

on: [push, pull_request, workflow_dispatch]
jobs:

  benchmarks:
    strategy:
      fail-fast: false
      matrix:
        python-version: [
          # "3.10",
          # "3.11",
          "3.12",
          ]
        os: [macos-15-intel, macos-14, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup/
        with:
          python-version: ${{ matrix.python-version }}
          optional-dependencies: "development"
      - name: benchmark
        run: |
          python -m pytest --benchmark-only --benchmark-autosave
          pytest-benchmark compare --csv="results.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: results.csv

  regression-check:
    name: Check for Performance Regressions
    needs: benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download current run artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/current
          pattern: benchmark-results-*

      - name: Download baseline artifacts (dev)
        uses: dawidd6/action-download-artifact@v12
        with:
          workflow: benchmarks.yml
          branch: dev
          event: push
          workflow_conclusion: success
          name: benchmark-results-*
          name_is_regexp: true
          path: artifacts/baseline
          if_no_artifact_found: warn

      - name: Analyze Benchmarks
        id: analyze
        run: |
          python <<EOF
          import os
          import csv
          import glob
          import sys

          threshold = 1.50 # 50% slower
          regressions = []

          print("Scanning for artifacts...")

          # 1. Map Baseline Files
          baseline_map = {}
          # Use recursive glob to find results.csv inside artifact subfolders
          for file in glob.glob("artifacts/baseline/**/results.csv", recursive=True):
              # parent_dir will be 'benchmark-results-ubuntu-latest', etc.
              parent_dir = os.path.basename(os.path.dirname(file))
              baseline_map[parent_dir] = file
              print(f"Found baseline for: {parent_dir}")

          if not baseline_map:
              print("::warning::No baseline artifacts found. Skipping regression check.")
              sys.exit(0)

          # 2. Compare Current vs Baseline
          for current_file in glob.glob("artifacts/current/**/results.csv", recursive=True):
              parent_dir = os.path.basename(os.path.dirname(current_file))
              baseline_file = baseline_map.get(parent_dir)

              if not baseline_file:
                  print(f"::warning::No baseline found for {parent_dir}. Skipping.")
                  continue

              print(f"Comparing {parent_dir}...")
              
              # Load Baseline
              baseline_means = {}
              with open(baseline_file, 'r') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      baseline_means[row['name']] = float(row['mean'])

              # Check Current
              with open(current_file, 'r') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      name = row['name']
                      try:
                          current_mean = float(row['mean'])
                      except ValueError:
                          continue # Skip rows with invalid data

                      if name in baseline_means:
                          base_mean = baseline_means[name]
                          # Logic: if base is 1.0s, threshold is 1.5s. if current is 1.6s -> Regression.
                          if base_mean > 0 and current_mean > (base_mean * threshold):
                              ratio = current_mean / base_mean
                              regressions.append(f"| {parent_dir} | {name} | {base_mean:.4f}s | {current_mean:.4f}s | {ratio:.1f}x |")

          # 3. Report
          if regressions:
              msg = "### ⚠️ Performance Regression Detected\n"
              msg += "The following tests are running more than **50% slower** than the baseline (main):\n\n"
              msg += "| OS | Test | Baseline (s) | Current (s) | Slowdown |\n"
              msg += "|---|---|---|---|---|\n"
              msg += "\n".join(regressions)
              
              with open(os.environ['GITHUB_OUTPUT'], 'a') as gh_out:
                  print("regression_found=true", file=gh_out)
                  
              with open("regression_report.md", "w") as report:
                  report.write(msg)
              
              print("Regressions found!")
          else:
               print("No significant regressions found.")
          EOF

      - name: Comment on PR
        uses: actions/github-script@v8
        if: steps.analyze.outputs.regression_found == 'true'
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('regression_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            })
